<!-- Ilustrasi kalender meja biru untuk state kosong -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Bayangan -->
  <ellipse cx="105" cy="190" rx="70" ry="10" fill="#D6DEFF" opacity="0.5"/>

  <!-- Badan kalender utama -->
  <rect x="30" y="40" width="140" height="130" rx="8" ry="8" fill="#E8EDFF"/>

  <!-- Lipatan sudut kanan bawah -->
  <path d="M150 170 L170 170 L170 150 Q170 170 150 170 Z" fill="#C5CFFF"/>
  <path d="M150 170 L170 150 L150 150 Z" fill="#D6DEFF"/>

  <!-- Header biru tua -->
  <rect x="30" y="40" width="140" height="35" rx="8" ry="8" fill="#3A4DA0"/>
  <rect x="30" y="60" width="140" height="15" fill="#3A4DA0"/>

  <!-- Cincin/ring atas -->
  <rect x="65" y="28" width="10" height="25" rx="5" ry="5" fill="#8E99C0"/>
  <rect x="125" y="28" width="10" height="25" rx="5" ry="5" fill="#8E99C0"/>

  <!-- Kisi kotak-kotak biru muda -->
  <!-- Baris 1 -->
  <rect x="45" y="85" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <rect x="73" y="85" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <rect x="101" y="85" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <rect x="129" y="85" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <!-- Baris 2 -->
  <rect x="45" y="109" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <rect x="73" y="109" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <rect x="101" y="109" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <rect x="129" y="109" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <!-- Baris 3 -->
  <rect x="45" y="133" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <rect x="73" y="133" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <rect x="101" y="133" width="22" height="18" rx="3" fill="#B8C4FF"/>
  <rect x="129" y="133" width="22" height="18" rx="3" fill="#C5CEFF"/>
</svg>
